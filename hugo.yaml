baseURL: https://tytianyizhou.github.io/
locale: en-us
title: Tianyi Zhou
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

params:
  env: production
  author: Tianyi Zhou
  description: "Tianyi Zhou: PhD student working on reliable, safe, and aligned language models."
  defaultTheme: auto # follows the visitor's OS; toggle button in header
  disableThemeToggle: false

  # ---- Your profile (shown on the home page) -------------------------------
  profile:
    name: Tianyi Zhou # bolded automatically in publication author lists
    image: /images/profile.png # replace with /images/profile.jpg
    role: "PhD Student in Computer Science, [KTH Royal Institute of Technology](https://www.kth.se/profile/tzho)<br>Visiting PhD Student, Stanford University"
    # Shown in the Contact section at the bottom of the home page (markdown ok)
    contact: |
      **Email:** [tyzhou@stanford.edu](mailto:tyzhou@stanford.edu)<br>
      **Affiliations:** KTH Royal Institute of Technology, Stockholm · Stanford University, Stanford, CA

  socialIcons:
    - name: email
      url: "mailto:tyzhou@stanford.edu"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=fdUJcwYAAAAJ&hl=en"
    - name: github
      url: "https://github.com/tianyichow-tcs"
    - name: linkedin
      url: "https://www.linkedin.com/in/tianyi-zhou-b28830269/"
    # - name: cv
    #   url: "/cv.pdf"

  # How many items the home page shows before "show all"
  homeNewsCount: 6
  homeNotesCount: 5

  # Topic tabs for "Selected Publications" on the home page.
  # `id` must match the `topic:` field in data/publications.yaml.
  pubTopics:
    - { id: llm, name: "LLM reliability and capabilities" }
    - { id: data-mining, name: "Mitigate harm in online ML systems" }

  # ---- Notes (blog) settings, Lilian-Weng style ----------------------------
  ShowReadingTime: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: true
  dateFormat: "January 2, 2006"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - { identifier: notes, name: Notes, url: /posts/, weight: 10 }
    - { identifier: pubs, name: Publications, url: /publications/, weight: 20 }
    - { identifier: archive, name: Archive, url: /archives/, weight: 30 }
    - { identifier: tags, name: Tags, url: /tags/, weight: 40 }
    - { identifier: search, name: Search, url: /search/, weight: 50 }

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML inside markdown
    extensions:
      passthrough: # lets $...$ / $$...$$ reach the KaTeX renderer untouched
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"], ["$", "$"]]
  highlight:
    noClasses: false
    lineNos: false
